# 在所有自定义变量已由前置 default_server 的 set 指令注册后、业务 access_log 之前 include。
# 全量记录请求、转发请求、上游响应和实际返回响应的正文原文。
# escape=json 会把正文转义为 JSON 字符串，避免正文破坏 JSON Lines 格式。
log_format waf_audit escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"node_role":"$waf_node_role",'
    '"local_request_id":"$request_id",'
    '"trace_id":"$waf_trace_id",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"request_host":"$waf_request_host",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"rule_id":"$waf_rule_id",'
    '"action":"$waf_action",'
    '"reason":"$waf_reason",'
    '"field":"$waf_field",'
    '"status":"$status",'
    '"request_length":"$request_length",'
    '"request_body":"$waf_request_body",'
    '"request_body_bytes":"$waf_request_body_bytes",'
    '"request_body_sha256":"$waf_request_body_sha256",'
    '"forward_body":"$waf_forward_body",'
    '"forward_body_bytes":"$waf_forward_body_bytes",'
    '"forward_body_sha256":"$waf_forward_body_sha256",'
    '"upstream_addr":"$waf_upstream_addr",'
    '"upstream_status":"$waf_upstream_status",'
    '"response_schema":"$waf_response_schema",'
    '"response_body":"$waf_response_body",'
    '"response_body_bytes":"$waf_response_body_bytes",'
    '"response_body_sha256":"$waf_response_body_sha256",'
    '"forward_response_body":"$waf_forward_response_body",'
    '"forward_response_bytes":"$waf_forward_response_bytes",'
    '"forward_response_sha256":"$waf_forward_response_sha256",'
    '"bytes_sent":"$bytes_sent",'
    '"request_time":"$request_time"'
  '}';
