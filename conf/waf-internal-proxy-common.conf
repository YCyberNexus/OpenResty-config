# 在 internal upstream location{} 内 include；只向固定 upstream 重建必要请求头。
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_request_buffering on;
proxy_buffering off;
# 白名单只允许无正文请求或经 WAF 规范化后的 JSON；长度由代理模块按实际正文生成。
proxy_set_header Content-Type application/json;
proxy_set_header Accept application/json;
proxy_set_header Accept-Encoding "";
proxy_set_header Connection "";
proxy_set_header X-WAF-Trace-ID $waf_trace_id;
proxy_hide_header X-WAF-Internal-Upstream-Addr;
header_filter_by_lua_block {
  ngx.header["X-WAF-Internal-Upstream-Addr"] = ngx.var.upstream_addr or "-"
}
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;
