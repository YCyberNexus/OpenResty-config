# 用 openresty -p "$PWD/" -c conf/nginx.conf 启动。
# 七层 WAF（access_by_lua）+ 放行后 proxy_pass 转发到上游 OpenClaw（HTTPS，不做 mTLS）。
# 四层出口/路由/HA 是另一条线（方案 P1/P6）。
worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events {
  worker_connections 256;
}

http {
  lua_package_path "$prefix/lua/?.lua;$prefix/conf/?.lua;;";

  # 把 body 缓冲调到与上限一致，避免大 body 落盘导致漏判（方案 P3-1）
  client_body_buffer_size 1m;
  client_max_body_size 1m;

  # 正则编译缓存常驻，配合 ngx.re 的 "jo"（方案 P5-3）
  lua_regex_cache_max_entries 1024;

  # 不接收带下划线的请求头（nginx 默认即 off）；显式声明，防有人开启后
  # x_openclaw_model 这类下划线形态绕过 forbidden_headers 的 x-openclaw-* 拦截。
  underscores_in_headers off;

  # 启动时构建一次决策器（生产改为热更新加载，方案 P5）
  init_by_lua_block {
    local config = require("waf_rules")
    require("waf.handler").init(config)
  }

  # 上游 OpenClaw（HTTPS）。不做 mTLS、不校验上游证书 —— 简化方案。
  upstream openclaw_backend {
    server 10.0.0.10:443;   # ⚠ 占位！部署前改成 OpenClaw 对外业务 IP:端口（不是控制面 127.0.0.1:18789）
    keepalive 16;
  }

  server {
    listen 8080;
    default_type application/json;

    location / {
      access_by_lua_block {
        require("waf.handler").access()
      }

      # 放行后转发到 OpenClaw。本地无上游自测时，可临时把下面整段换回 stub：
      #   content_by_lua_block { ngx.say('{"ok":true,"upstream":"stub"}') }
      proxy_pass https://openclaw_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";

      proxy_ssl_protocols TLSv1.2 TLSv1.3;
      proxy_ssl_verify off;   # 不做 mTLS，也不校验上游证书（内网简化）
    }
  }
}
