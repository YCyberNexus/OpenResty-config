# 在 nginx 的 http{} 内 include。只放蓝/黄/dev 三种节点完全一致的七层与审计定义。
lua_package_path "$prefix/lua/?.lua;$prefix/conf/?.lua;;";

# V2 buffered 请求在 1 MiB 内完成规范化；显式 stream 上传最多 64 MiB，可落临时文件。
client_body_buffer_size 128k;
client_max_body_size 64m;
# ngx.location.capture 将 buffered 响应保存在内存；stream 响应不使用该缓冲。
subrequest_output_buffer_size 1m;
underscores_in_headers off;
merge_slashes on;
log_subrequest off;
server_tokens off;

# 默认虚拟主机不读取、不记录被拒绝请求的正文；只保留请求长度等最小审计字段。
log_format waf_reject escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"local_request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":"$status",'
    '"request_length":"$request_length",'
    '"request_body":"",'
    '"response_body":"",'
    '"request_time":"$request_time"'
  '}';
