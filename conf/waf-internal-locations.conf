  proxy_read_timeout 15s;
}

location ^~ /__waf_stream/standard/ {
  internal;
  proxy_pass $waf_upstream_origin$waf_upstream_uri;
  include waf-internal-proxy-common.conf;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 60s;
}

location ^~ /__waf_stream/long/ {
  internal;
  proxy_pass $waf_upstream_origin$waf_upstream_uri;
  include waf-internal-proxy-common.conf;
  proxy_connect_timeout 5s;
  proxy_send_timeout 300s;
  proxy_read_timeout 3600s;
}
