# 在受保护 server{} 内 include。下一跳 origin/Host 只能由已体检的 waf_routes.lua 写入变量。
# 三档固定 timeout 避免把任意数值直接带入 Nginx 指令。
location ^~ /__waf_upstream/fast/ {
  internal;
  proxy_pass $waf_upstream_origin$waf_upstream_uri;
  include waf-internal-proxy-common.conf;
  proxy_connect_timeout 2s;
  proxy_send_timeout 10s;
  proxy_read_timeout 15s;
}

location ^~ /__waf_upstream/standard/ {
  internal;
  proxy_pass $waf_upstream_origin$waf_upstream_uri;
  include waf-internal-proxy-common.conf;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 60s;
}

location ^~ /__waf_upstream/long/ {
  internal;
  proxy_pass $waf_upstream_origin$waf_upstream_uri;
  include waf-internal-proxy-common.conf;
  proxy_connect_timeout 5s;
  proxy_send_timeout 300s;
  proxy_read_timeout 3600s;
}

location ^~ /__waf_stream/fast/ {
  internal;
  proxy_pass $waf_upstream_origin$waf_upstream_uri;
  include waf-internal-proxy-common.conf;
  proxy_connect_timeout 2s;
