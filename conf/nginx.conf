# 本地联调配置；显式加载知识库示例规则，验证 Host、请求和响应过滤。
worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events { worker_connections 256; }

http {
  include waf-http-common.conf;

  init_by_lua_block {
    local rules = require("waf_rules_knowledge_example")
    require("waf.handler").init(rules)
  }

  upstream knowledge_stub {
    server 127.0.0.1:18080;
    keepalive 4;
  }

  # 先注册 Lua 可写审计变量；未命中业务 Host 的请求也读取并记录完整请求体。
  server {
    listen 127.0.0.1:8080 default_server;
    server_name "";
    set $waf_node_role "dev";
    set $waf_trace_id $request_id;
    include waf-audit-vars.conf;
    access_log logs/audit-rejected.log waf_reject;
    location / {
      content_by_lua_block {
        ngx.req.read_body()
        return ngx.exit(444)
      }
    }
  }

  include waf-audit-log-format.conf;

  server {
    listen 127.0.0.1:18080;
    server_name knowledge-stub.local;
    default_type application/json;

    location = /ai/knowledge/health {
      return 200 '{"status":"ok","database":"ok","active_assets":25,"total_assets":28,"embedding_model":"BAAI/bge-base-zh-v1.5","embedding_dim":768}';
    }

    location = /ai/knowledge/search {
      content_by_lua_block {
        ngx.req.read_body()
        local cjson = require("cjson.safe")
        local body = cjson.decode(ngx.req.get_body_data() or "") or {}
        local query = type(body.query) == "string" and body.query:match("^%s*(.-)%s*$") or ""
        local top_k = body.top_k or 5
        if query == "__waf_test_invalid_response__" then
          ngx.say('{"secret":"upstream-must-not-leak"}')
          return
        end
        ngx.say('{"query":' .. cjson.encode(query)
          .. ',"top_k":' .. tostring(top_k)
          .. ',"retrieval_mode":"pgvector_active_versions_only"'
          .. ',"embedding_model":"BAAI/bge-base-zh-v1.5","results":[]}')
      }
    }
  }

  server {
    listen 127.0.0.1:8080;
    server_name localhost 127.0.0.1;
    default_type application/json;

    set $waf_node_role "dev";
    set $waf_trace_id $request_id;
    include waf-audit-vars.conf;
    access_log logs/audit.log waf_audit;
    add_header X-Request-ID $waf_trace_id always;

    location / {
      include waf-public-location.conf;
    }

    location ^~ /__waf_upstream/ {
      internal;
      rewrite ^/__waf_upstream(/.*)$ $1 break;
      proxy_pass http://knowledge_stub;
      proxy_set_header Host knowledge-stub.local;
      include waf-internal-proxy-common.conf;
    }
  }
}
