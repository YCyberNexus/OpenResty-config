# 在 nginx 的 http{} 内 include。只放蓝/黄/dev 三种节点完全一致的七层与审计定义。
lua_package_path "$prefix/lua/?.lua;$prefix/conf/?.lua;;";

client_body_buffer_size 16k;
client_max_body_size 16k;
# ngx.location.capture 将响应保存在内存；此值是所有规则不可突破的技术上限。
subrequest_output_buffer_size 1m;
underscores_in_headers off;
merge_slashes on;
log_subrequest off;
server_tokens off;

# 默认虚拟主机使用内置 $request_body 记录被拒绝请求的完整正文；444 响应没有正文。
log_format waf_reject escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"local_request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":"$status",'
    '"request_length":"$request_length",'
    '"request_body":"$request_body",'
    '"response_body":"",'
    '"request_time":"$request_time"'
  '}';
