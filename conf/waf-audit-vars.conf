# 在受保护的 server{} 内 include。变量必须先由 nginx `set` 声明，Lua 才能安全赋值。
set $waf_action "unprocessed";
set $waf_reason "-";
set $waf_field "-";
set $waf_rule_id "-";
set $waf_request_body_bytes "0";
set $waf_request_body_sha256 "-";
set $waf_forward_body_bytes "0";
set $waf_forward_body_sha256 "-";
set $waf_upstream_content_type "";
