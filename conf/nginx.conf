# 起步骨架配置：用 openresty -p "$PWD/" -c conf/nginx.conf 启动。
# 仅演示七层 WAF（access_by_lua）；四层出口/路由/HA 是另一条线（方案 P1/P6）。
worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events {
  worker_connections 256;
}

http {
  lua_package_path "$prefix/lua/?.lua;$prefix/conf/?.lua;;";

  # 把 body 缓冲调到与上限一致，避免大 body 落盘导致漏判（方案 P3-1）
  client_body_buffer_size 1m;
  client_max_body_size 1m;

  # 正则编译缓存常驻，配合 ngx.re 的 "jo"（方案 P5-3）
  lua_regex_cache_max_entries 1024;

  # 不接收带下划线的请求头（nginx 默认即 off）；显式声明，防有人开启后
  # x_openclaw_model 这类下划线形态绕过 forbidden_headers 的 x-openclaw-* 拦截。
  underscores_in_headers off;

  # 启动时构建一次决策器（生产改为热更新加载，方案 P5）
  init_by_lua_block {
    local config = require("waf_rules")
    require("waf.handler").init(config)
  }

  server {
    listen 8080;
    default_type application/json;

    location / {
      access_by_lua_block {
        require("waf.handler").access()
      }

      # 测试桩上游：放行后返回固定 JSON。
      # 生产改为 proxy_pass 到对端 OpenClaw upstream，并叠加 mTLS（方案 P4-1）。
      content_by_lua_block {
        ngx.say('{"ok":true,"upstream":"stub"}')
      }
    }
  }
}
