# 在所有自定义变量已由前置 default_server 的 set 指令注册后、业务 access_log 之前 include。
# 不记录 query/body 原文；正文只记录 SHA-256 和字节数，避免审计日志复制知识内容。
log_format waf_audit escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"node_role":"$waf_node_role",'
    '"local_request_id":"$request_id",'
    '"trace_id":"$waf_trace_id",'
    '"remote_addr":"$remote_addr",'
    '"peer_mtls":"$ssl_client_verify",'
    '"peer_subject":"$ssl_client_s_dn",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"rule_id":"$waf_rule_id",'
    '"policy_version":"$waf_policy_version",'
    '"policy_direction":"$waf_policy_direction",'
    '"approval_id":"$waf_approval_id",'
    '"action":"$waf_action",'
    '"reason":"$waf_reason",'
    '"field":"$waf_field",'
    '"status":"$status",'
    '"request_length":"$request_length",'
    '"request_body_bytes":"$waf_request_body_bytes",'
    '"request_body_sha256":"$waf_request_body_sha256",'
    '"forward_body_bytes":"$waf_forward_body_bytes",'
    '"forward_body_sha256":"$waf_forward_body_sha256",'
    '"upstream_target":"$waf_upstream_target",'
    '"upstream_status":"$waf_upstream_status",'
    '"upstream_body_bytes":"$waf_upstream_body_bytes",'
    '"upstream_body_sha256":"$waf_upstream_body_sha256",'
    '"response_body_bytes":"$waf_response_body_bytes",'
    '"response_body_sha256":"$waf_response_body_sha256",'
    '"bytes_sent":"$bytes_sent",'
    '"request_time":"$request_time"'
  '}';
