# 在 V2 internal upstream location{} 内 include。
# handler 已清空客户端原始头，只留下规则显式准许的头和 WAF 重建的媒体类型/Accept。
proxy_http_version 1.1;
proxy_pass_request_headers on;
proxy_request_buffering on;
proxy_buffering off;
proxy_set_header Host $waf_upstream_host;
proxy_set_header Accept-Encoding "";
proxy_set_header Connection "";
proxy_set_header X-WAF-Trace-ID $waf_trace_id;
proxy_hide_header X-WAF-Internal-Upstream-Addr;
header_filter_by_lua_block {
  require("waf.handler").upstream_header_filter()
}
body_filter_by_lua_block {
  require("waf.handler").stream_body_filter()
}
